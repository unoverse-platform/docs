<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- ============ left: where interfaces come from ============ -->
  <rect x="30" y="92" width="180" height="52" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="56" cy="118" r="4" fill="#6D5DF6"/>
  <circle cx="70" cy="118" r="4" fill="#8B7EF8"/>
  <circle cx="84" cy="118" r="4" fill="#c7c1fb"/>
  <text x="100" y="114" font-size="13" font-weight="600" fill="#111827">an Agent</text>
  <text x="100" y="130" font-size="12" fill="#6b7280">streams them</text>

  <path d="M30 260 a90 14 0 0 1 180 0 v40 a90 14 0 0 1 -180 0 z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <path d="M30 260 a90 14 0 0 0 180 0" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="120" y="288" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">a query</text>
  <text x="120" y="304" font-size="12" fill="#6b7280" text-anchor="middle">fetches them</text>

  <!-- ============ middle: interfaces in flight, each wearing a state ============ -->
  <text x="395" y="46" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="0.08em">INTERFACES</text>
  <text x="395" y="62" font-size="11" fill="#9ca3af">each arrives in a state</text>

  <!-- three compact cards, state: grid -->
  <g>
    <rect x="360" y="78" width="64" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="368" y="86" width="48" height="30" rx="6" fill="#f3f4f6"/>
    <rect x="368" y="124" width="40" height="6" rx="3" fill="#d1d5db"/>
    <rect x="368" y="136" width="28" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="392" y="70" width="38" height="17" rx="8.5" fill="#6D5DF6"/>
    <text x="411" y="82" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">grid</text>
  </g>
  <g>
    <rect x="440" y="96" width="64" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="448" y="104" width="48" height="30" rx="6" fill="#f3f4f6"/>
    <rect x="448" y="142" width="40" height="6" rx="3" fill="#d1d5db"/>
    <rect x="448" y="154" width="28" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="472" y="88" width="38" height="17" rx="8.5" fill="#6D5DF6"/>
    <text x="491" y="100" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">grid</text>
  </g>
  <g>
    <rect x="393" y="150" width="64" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="401" y="158" width="48" height="30" rx="6" fill="#f3f4f6"/>
    <rect x="401" y="196" width="40" height="6" rx="3" fill="#d1d5db"/>
    <rect x="401" y="208" width="28" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="425" y="142" width="38" height="17" rx="8.5" fill="#6D5DF6"/>
    <text x="444" y="154" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">grid</text>
  </g>

  <!-- one full card, state: page -->
  <g>
    <rect x="390" y="262" width="92" height="98" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="399" y="271" width="74" height="34" rx="6" fill="#f3f4f6"/>
    <rect x="399" y="313" width="60" height="7" rx="3.5" fill="#d1d5db"/>
    <rect x="399" y="326" width="74" height="5" rx="2.5" fill="#e5e7eb"/>
    <rect x="399" y="336" width="66" height="5" rx="2.5" fill="#e5e7eb"/>
    <rect x="399" y="346" width="52" height="5" rx="2.5" fill="#e5e7eb"/>
    <rect x="438" y="254" width="44" height="17" rx="8.5" fill="#4C3FD1"/>
    <text x="460" y="266" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">page</text>
  </g>

  <!-- arrows: sources to interfaces -->
  <path d="M215 118 C 260 118, 300 108, 352 108" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M215 280 C 270 280, 320 300, 382 306" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- arrows: interfaces to templates -->
  <path d="M512 130 C 545 130, 555 138, 582 144" fill="none" stroke="#6D5DF6" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M490 306 C 530 306, 550 300, 582 294" fill="none" stroke="#6D5DF6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ right: the app arranges templates ============ -->
  <rect x="596" y="30" width="320" height="346" rx="16" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="614" y="56" font-size="13" font-weight="700" fill="#111827">app</text>
  <text x="648" y="56" font-size="12" fill="#6b7280">arranges templates</text>

  <!-- template one: reacts with its grid shape -->
  <rect x="614" y="74" width="284" height="132" rx="12" fill="#f7f6fe" stroke="#6D5DF6" stroke-width="1.5"/>
  <text x="628" y="96" font-size="12" font-weight="700" fill="#4C3FD1">template</text>
  <text x="691" y="96" font-size="11" fill="#6b7280">reacts: draws its grid shape</text>
  <g>
    <rect x="628" y="108" width="80" height="82" rx="8" fill="#ffffff" stroke="#c7c1fb" stroke-width="1.5"/>
    <rect x="636" y="116" width="64" height="30" rx="5" fill="#ece9fd"/>
    <rect x="636" y="152" width="52" height="6" rx="3" fill="#d1d5db"/>
    <rect x="636" y="164" width="38" height="6" rx="3" fill="#e5e7eb"/>
  </g>
  <g>
    <rect x="716" y="108" width="80" height="82" rx="8" fill="#ffffff" stroke="#c7c1fb" stroke-width="1.5"/>
    <rect x="724" y="116" width="64" height="30" rx="5" fill="#ece9fd"/>
    <rect x="724" y="152" width="52" height="6" rx="3" fill="#d1d5db"/>
    <rect x="724" y="164" width="38" height="6" rx="3" fill="#e5e7eb"/>
  </g>
  <g>
    <rect x="804" y="108" width="80" height="82" rx="8" fill="none" stroke="#c7c1fb" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="844" y="153" font-size="11" fill="#9ca3af" text-anchor="middle">slot</text>
  </g>

  <!-- template two: reacts with its page shape -->
  <rect x="614" y="222" width="284" height="132" rx="12" fill="#f7f6fe" stroke="#6D5DF6" stroke-width="1.5"/>
  <text x="628" y="244" font-size="12" font-weight="700" fill="#4C3FD1">template</text>
  <text x="691" y="244" font-size="11" fill="#6b7280">reacts: draws its page shape</text>
  <g>
    <rect x="628" y="256" width="256" height="82" rx="8" fill="#ffffff" stroke="#c7c1fb" stroke-width="1.5"/>
    <rect x="636" y="264" width="86" height="66" rx="5" fill="#ece9fd"/>
    <rect x="732" y="268" width="120" height="8" rx="4" fill="#d1d5db"/>
    <rect x="732" y="284" width="144" height="5" rx="2.5" fill="#e5e7eb"/>
    <rect x="732" y="294" width="144" height="5" rx="2.5" fill="#e5e7eb"/>
    <rect x="732" y="304" width="112" height="5" rx="2.5" fill="#e5e7eb"/>
    <rect x="732" y="318" width="56" height="14" rx="7" fill="#6D5DF6"/>
  </g>
</svg>
