<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="sarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="sarrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D5DF6"/>
    </marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7EF8"/>
      <stop offset="1" stop-color="#4C3FD1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ============ inputs ============ -->
  <text x="40" y="32" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="0.08em">THE SDK RECEIVES</text>

  <!-- the definition -->
  <rect x="40" y="46" width="250" height="106" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="56" y="68" font-size="12" font-weight="600" fill="#111827">the definition</text>
  <text x="56" y="88" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">type: Box</text>
  <text x="56" y="104" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">- Image  bind: primaryImage</text>
  <text x="56" y="120" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">- Text   bind: title</text>
  <text x="56" y="136" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">- Button label: Add to basket</text>

  <!-- the data -->
  <rect x="40" y="166" width="250" height="90" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="56" y="188" font-size="12" font-weight="600" fill="#111827">the data</text>
  <text x="56" y="208" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">title: Trail Runner</text>
  <text x="56" y="224" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">price: £89</text>
  <text x="56" y="240" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">description: Lightweight…</text>

  <!-- the theme -->
  <rect x="40" y="270" width="250" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="56" y="292" font-size="12" font-weight="600" fill="#111827">the theme</text>
  <circle cx="64" cy="316" r="8" fill="#6D5DF6"/>
  <circle cx="86" cy="316" r="8" fill="#8B7EF8"/>
  <circle cx="108" cy="316" r="8" fill="#111827"/>
  <text x="128" y="320" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">radius · space · type</text>

  <!-- arrows in -->
  <path d="M296 99 C 340 99, 350 150, 392 168" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#sarr)"/>
  <path d="M296 203 h96" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#sarr)"/>
  <path d="M296 307 C 344 307, 352 244, 392 228" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#sarr)"/>

  <!-- ============ the SDK ============ -->
  <rect x="400" y="152" width="170" height="96" rx="12" fill="#f7f6fe" stroke="#6D5DF6" stroke-width="1.5"/>
  <text x="485" y="192" font-size="15" font-weight="700" fill="#4C3FD1" text-anchor="middle">the SDK</text>
  <text x="485" y="212" font-size="11" fill="#6b7280" text-anchor="middle">draws with the platform's</text>
  <text x="485" y="226" font-size="11" fill="#6b7280" text-anchor="middle">own native controls</text>

  <path d="M576 200 h60" fill="none" stroke="#6D5DF6" stroke-width="1.5" marker-end="url(#sarrp)"/>

  <!-- ============ the drawn component ============ -->
  <text x="662" y="32" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="0.08em">THE CLIENT RENDERS IT</text>

  <g filter="url(#soft)">
    <rect x="662" y="46" width="238" height="282" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  <rect x="676" y="60" width="210" height="120" rx="10" fill="url(#hero)"/>
  <path d="M700 156 l30 -34 l26 22 l20 -16 l36 28 z" fill="#ffffff" opacity="0.35"/>
  <circle cx="760" cy="94" r="11" fill="#ffffff" opacity="0.5"/>
  <text x="676" y="212" font-size="16" font-weight="700" fill="#111827">Trail Runner</text>
  <text x="676" y="234" font-size="13" fill="#6b7280">Lightweight, any terrain.</text>
  <text x="676" y="266" font-size="15" font-weight="700" fill="#4C3FD1">£89</text>
  <rect x="676" y="284" width="210" height="34" rx="17" fill="#6D5DF6"/>
  <text x="781" y="306" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Add to basket</text>
</svg>
