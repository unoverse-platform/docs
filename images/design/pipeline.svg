<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="parr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="parrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D5DF6"/>
    </marker>
  </defs>

  <!-- 1. the file -->
  <text x="60" y="66" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="0.08em">YOU WRITE</text>
  <g>
    <path d="M60 84 h110 l24 24 v96 a8 8 0 0 1 -8 8 h-126 a8 8 0 0 1 -8 -8 v-112 a8 8 0 0 1 8 -8 z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <path d="M170 84 v24 h24" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="74" y="136" font-size="12" font-weight="600" fill="#111827">product-card.yaml</text>
    <rect x="74" y="148" width="96" height="6" rx="3" fill="#ece9fd"/>
    <rect x="74" y="160" width="76" height="6" rx="3" fill="#ece9fd"/>
    <rect x="74" y="172" width="88" height="6" rx="3" fill="#ece9fd"/>
    <rect x="74" y="184" width="60" height="6" rx="3" fill="#ece9fd"/>
  </g>

  <path d="M226 148 h74" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#parr)"/>

  <!-- 2. the universe -->
  <text x="312" y="66" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="0.08em">YOUR UNIVERSE SERVES IT</text>
  <rect x="312" y="84" width="240" height="128" rx="12" fill="#f7f6fe" stroke="#6D5DF6" stroke-width="1.5"/>
  <text x="330" y="114" font-size="13" font-weight="700" fill="#4C3FD1">served over MCP</text>
  <rect x="330" y="128" width="204" height="26" rx="6" fill="#ffffff" stroke="#c7c1fb" stroke-width="1.2"/>
  <text x="340" y="145" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4C3FD1">unoverse://components/…</text>
  <rect x="330" y="162" width="204" height="26" rx="6" fill="#ffffff" stroke="#c7c1fb" stroke-width="1.2"/>
  <text x="340" y="179" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4C3FD1">unoverse://theme/acme</text>

  <!-- 3. the channels -->
  <text x="656" y="66" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="0.08em">EVERY CHANNEL DRAWS IT</text>
  <g>
    <rect x="656" y="84" width="224" height="34" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="672" y="106" font-size="12" font-weight="600" fill="#111827">web</text>
    <text x="872" y="106" font-size="11.5" fill="#6b7280" text-anchor="end">React</text>
  </g>
  <g>
    <rect x="656" y="126" width="224" height="34" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="672" y="148" font-size="12" font-weight="600" fill="#111827">iOS</text>
    <text x="872" y="148" font-size="11.5" fill="#6b7280" text-anchor="end">SwiftUI</text>
  </g>
  <g>
    <rect x="656" y="168" width="224" height="34" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="672" y="190" font-size="12" font-weight="600" fill="#111827">Android</text>
    <text x="872" y="190" font-size="11.5" fill="#6b7280" text-anchor="end">Jetpack Compose</text>
  </g>
  <g>
    <rect x="656" y="210" width="224" height="34" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="672" y="232" font-size="12" font-weight="600" fill="#111827">Flutter</text>
    <text x="872" y="232" font-size="11.5" fill="#6b7280" text-anchor="end">Flutter widgets</text>
  </g>

  <path d="M566 148 h80" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#parr)"/>
  <text x="606" y="138" font-size="11" fill="#6b7280" text-anchor="middle">SDKs</text>

  <!-- the subscription: how updates travel back out -->
  <path d="M768 258 v14 a8 8 0 0 1 -8 8 h-320 a8 8 0 0 1 -8 -8 v-52" fill="none" stroke="#6D5DF6" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#parrp)"/>
  <text x="596" y="292" font-size="11.5" fill="#4C3FD1" text-anchor="middle">clients subscribe: publish a change and every channel updates, no release</text>
</svg>
