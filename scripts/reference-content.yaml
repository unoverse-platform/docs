# Human-written copy for the generated Reference tab.
#
# The SHAPE comes from packages/sdk/conformance/schema (the contract every SDK passes).
# The WORDS come from here. `npm run gen-reference` joins them and FAILS when the schema
# carries an entry this file does not describe.
#
# That failure is the point. Two hand-maintained lists (the linter's vocabulary.mjs and
# this schema) stayed in sync with each other and both drifted from the prose, which is
# how `Select` and `Orb` shipped as primitives while the docs said the set was 16.

primitives:
  Box:
    group: Structure
    summary: "A container. The one you reach for by default, and the thing every layout is built from."
    example: |
      type: Box
      style: { direction: column, gap: "3", padding: "6" }
      children:
        - { type: Text, value: Hello }
  Stack:
    group: Structure
    summary: "Children in one direction, spaced evenly. A `Box` that has already decided it is a stack."
    example: |
      type: Stack
      style: { direction: column, gap: "2" }
      children:
        - { type: Text, value: First }
        - { type: Text, value: Second }
  Row:
    group: Structure
    summary: "Children left to right. Stacks automatically once the space runs out."
    example: |
      type: Row
      style: { gap: "3", align: center }
      children:
        - { type: Icon, icon: check }
        - { type: Text, value: Confirmed }
  Column:
    group: Structure
    summary: "Children top to bottom."
    example: |
      type: Column
      style: { gap: "2" }
      children:
        - { type: Text, value: Total }
        - { type: Text, value: "$49" }
  Each:
    group: Structure
    summary: "Repeats one subtree over a list, either a literal `items` array or a bound field."
    example: |
      type: Each
      bind: { items: features }
      style: { direction: column, gap: "2" }
      template:
        type: Text
        bind: { value: label }
  Switch:
    group: Structure
    summary: "Draws one case out of several, chosen by a single discriminant field."
    example: |
      type: Switch
      on: view
      cases:
        products: { type: Text, value: The rail card }
        detail: { type: Text, value: The full page }
  ComponentSlot:
    group: Structure
    summary: "Where a component renders inside an app. A bare slot is the conversation flow; one with `select` is a reaction surface."
    example: |
      type: ComponentSlot
      select: { from: all, where: { field: view, eq: detail }, limit: 1 }
      frame:
        type: Box
        style: { direction: column, overflow: auto }
  Timeline:
    group: Structure
    summary: "The conversation itself. You supply the user and assistant turn subtrees, and the stream fills them."
    example: |
      type: Timeline
      user:
        type: Text
        bind: { value: text }
      assistant:
        type: Markdown
        bind: { value: text }
  Text:
    group: Leaf
    summary: "A string. Bound to a field, or a literal you typed."
    example: |
      type: Text
      bind: { value: title }
      style: { font: headline.lg, color: text.primary }
  Image:
    group: Leaf
    summary: "An image, from a bound URL or a literal `src`."
    example: |
      type: Image
      bind: { src: primaryImage }
      alt: Product photo
      style: { width: full, radius: md, fit: cover }
  Button:
    group: Leaf
    summary: "Something to press. Carries the `action` that runs when it is pressed."
    example: |
      type: Button
      value: Choose plan
      action:
        type: setValue
        values:
          - { key: view, value: detail }
  Input:
    group: Leaf
    summary: "A text field. Its `bind.value` is the one two-way binding in the set: it reads and writes the same key."
    example: |
      type: Input
      bind: { value: draft }
      placeholder: Ask a question
  Select:
    group: Leaf
    summary: "A choice from a fixed list of options."
    example: |
      type: Select
      bind: { value: plan }
      options:
        - { value: starter, label: Starter }
        - { value: pro, label: Pro }
  Markdown:
    group: Leaf
    summary: "Renders markdown, for text an Agent wrote rather than text you laid out."
    example: |
      type: Markdown
      bind: { value: bodyCopy }
  Skeleton:
    group: Leaf
    summary: "A loading placeholder in the shape of the thing that has not arrived."
    example: |
      type: Skeleton
      style: { width: full, height: "8", radius: md }
  Icon:
    group: Leaf
    summary: "One glyph from the icon set. A literal name, or a bound field."
    example: |
      type: Icon
      icon: arrowRight
      style: { color: text.secondary }
  Orb:
    group: Leaf
    summary: "The voice indicator. Shows that a call is live and who is speaking."
    example: |
      type: Orb
      style: { width: "20", height: "20" }
  Ref:
    group: Helper
    summary: "Composes an atom. `props` remaps fields onto it, `with` passes literals into it."
    example: |
      type: Ref
      ref: button
      with: { label: Learn more, icon: arrowRight }
      action: { type: setValue, values: [{ key: view, value: detail }] }

styleKeys:
  # Size
  width:      { group: Size, css: "width", summary: "How wide the element is." }
  height:     { group: Size, css: "height", summary: "How tall the element is." }
  maxWidth:   { group: Size, css: "max-width", summary: "An upper bound on width. A page-level cap uses a name; an element's own size stays a step." }
  minWidth:   { group: Size, css: "min-width", summary: "A lower bound on width." }
  minHeight:  { group: Size, css: "min-height", summary: "A lower bound on height." }
  maxHeight:  { group: Size, css: "max-height", summary: "An upper bound on height." }
  flex:       { group: Size, css: "flex", summary: "How this child shares the space its parent has left." }
  # Spacing
  padding:    { group: Spacing, css: "padding", summary: "Space inside the element." }
  margin:     { group: Spacing, css: "margin", summary: "Space outside the element." }
  gap:        { group: Spacing, css: "gap", summary: "Space between children." }
  # Layout
  direction:  { group: Layout, css: "flex-direction", summary: "Whether children run in a row or a column." }
  wrap:       { group: Layout, css: "flex-wrap", summary: "Whether children wrap onto another line." }
  align:      { group: Layout, css: "align-items", summary: "Alignment across the direction children run in." }
  justify:    { group: Layout, css: "justify-content", summary: "Alignment along the direction children run in." }
  display:    { group: Layout, css: "display", summary: "Whether the element takes part in layout at all." }
  overflow:   { group: Layout, css: "overflow", summary: "What happens to content larger than the box." }
  position:   { group: Layout, css: "position", summary: "How the element is placed against its parent." }
  inset:      { group: Layout, css: "inset", summary: "All four offsets at once. `0` is the usual overlay." }
  top:        { group: Layout, css: "top", summary: "Offset from the top, when positioned." }
  right:      { group: Layout, css: "right", summary: "Offset from the right, when positioned." }
  bottom:     { group: Layout, css: "bottom", summary: "Offset from the bottom, when positioned." }
  left:       { group: Layout, css: "left", summary: "Offset from the left, when positioned." }
  zIndex:     { group: Layout, css: "z-index", summary: "Which of two overlapping elements draws on top." }
  # Grid
  columns:    { group: Grid, css: "grid-template-columns", summary: "Turns the element into a grid of this many columns." }
  span:       { group: Grid, css: "grid-column", summary: "How many of the parent grid's columns this child covers." }
  stackBelow: { group: Grid, css: "@container", summary: "The width at which a grid gives up and stacks. Measures the grid, never the viewport." }
  # Container queries
  container:  { group: Container, css: "container-type", summary: "Makes this element the thing its children measure themselves against." }
  hideBelow:  { group: Container, css: "@container", summary: "Hide once the container is narrower than this." }
  hideAbove:  { group: Container, css: "@container", summary: "Hide once the container is wider than this." }
  # Surface
  background: { group: Surface, css: "background", summary: "Background colour." }
  radial:     { group: Surface, css: "radial-gradient()", summary: "A radial gradient background." }
  border:     { group: Surface, css: "border", summary: "All four borders." }
  borderTop:    { group: Surface, css: "border-top", summary: "The top border alone." }
  borderRight:  { group: Surface, css: "border-right", summary: "The right border alone." }
  borderBottom: { group: Surface, css: "border-bottom", summary: "The bottom border alone." }
  borderLeft:   { group: Surface, css: "border-left", summary: "The left border alone." }
  outline:    { group: Surface, css: "outline", summary: "A ring drawn outside the border, usually for focus." }
  shadow:     { group: Surface, css: "box-shadow", summary: "Drop shadow." }
  radius:     { group: Surface, css: "border-radius", summary: "Corner rounding on all four corners." }
  radiusTopLeft:     { group: Surface, css: "border-top-left-radius", summary: "One corner's rounding." }
  radiusTopRight:    { group: Surface, css: "border-top-right-radius", summary: "One corner's rounding." }
  radiusBottomLeft:  { group: Surface, css: "border-bottom-left-radius", summary: "One corner's rounding." }
  radiusBottomRight: { group: Surface, css: "border-bottom-right-radius", summary: "One corner's rounding." }
  # Type
  font:       { group: Type, css: "font / font-size", summary: "A text style, such as `headline.lg`." }
  weight:     { group: Type, css: "font-weight", summary: "Font weight." }
  lineHeight: { group: Type, css: "line-height", summary: "Line height." }
  color:      { group: Type, css: "color", summary: "Text colour." }
  textAlign:  { group: Type, css: "text-align", summary: "Text alignment within its box." }
  # Media and motion
  fit:        { group: Media, css: "object-fit", summary: "How an image fills its box." }
  transform:  { group: Motion, css: "transform", summary: "A visual transform, such as a scale or a nudge." }
  transition: { group: Motion, css: "transition", summary: "Which property changes are animated, and how fast." }
  animation:  { group: Motion, css: "animation", summary: "A named keyframe animation from `semantic/keyframes.yaml`." }
  animationDelay: { group: Motion, css: "animation-delay", summary: "How long to wait before the animation starts." }
  cursor:     { group: Motion, css: "cursor", summary: "The pointer shown on hover." }
  # Conditional
  hover:      { group: Conditional, css: ":hover", summary: "A patch of styles applied while the pointer is over the element." }
  active:     { group: Conditional, css: ":active", summary: "A patch applied while the element is being pressed." }
  disabled:   { group: Conditional, css: ":disabled", summary: "A patch applied while the element is disabled." }
  when:       { group: Conditional, css: "(conditional)", summary: "A list of conditions, each applying its own style patch when it matches." }

# ONE example per group, not per key. 58 code blocks would bury the list they illustrate,
# and a key like `margin` needs no demonstration on its own. A group shows the shape.
styleGroups:
  Size: 'style: { width: full, maxWidth: reading, height: "20" }'
  Spacing: 'style: { padding: "6", gap: "3" }'
  Layout: 'style: { direction: row, align: center, justify: between }'
  Grid: 'style: { columns: "12", gap: "4" }   # a child then takes span: "4"'
  Container: 'style: { container: inline-size, hideBelow: "120" }'
  Surface: 'style: { background: surface.base, border: subtle, radius: lg }'
  Type: 'style: { font: headline.lg, weight: semibold, color: text.primary }'
  Media: 'style: { fit: cover }'
  Motion: 'style: { transition: fast, cursor: pointer }'
  Conditional: |
    style:
      background: surface.base
      hover: { background: surface.raised }
      when:
        - field: deltaPositive
          eq: true
          apply:
            color: status.success
