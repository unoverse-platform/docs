# Human-written copy for the generated Reference tab.
#
# The SHAPE comes from packages/sdk/conformance/schema (the contract every SDK passes).
# The WORDS come from here. `npm run gen-reference` joins them and FAILS when the schema
# carries an entry this file does not describe.
#
# That failure is the point. Two hand-maintained lists (the linter's vocabulary.mjs and
# this schema) stayed in sync with each other and both drifted from the prose, which is
# how `Select` and `Orb` shipped as primitives while the docs said the set was 16.

primitives:
  Box:
    group: Structure
    summary: "A container. The one you reach for by default, and the thing every layout is built from."
  Stack:
    group: Structure
    summary: "Children in one direction, spaced evenly. A `Box` that has already decided it is a stack."
  Row:
    group: Structure
    summary: "Children left to right. Stacks automatically once the space runs out."
  Column:
    group: Structure
    summary: "Children top to bottom."
  Each:
    group: Structure
    summary: "Repeats one subtree over a list, either a literal `items` array or a bound field."
  Switch:
    group: Structure
    summary: "Draws one case out of several, chosen by a single discriminant field."
  ComponentSlot:
    group: Structure
    summary: "Where a component renders inside an app. A bare slot is the conversation flow; one with `select` is a reaction surface."
  Timeline:
    group: Structure
    summary: "The conversation itself. You supply the user and assistant turn subtrees, and the stream fills them."
  Text:
    group: Leaf
    summary: "A string. Bound to a field, or a literal you typed."
  Image:
    group: Leaf
    summary: "An image, from a bound URL or a literal `src`."
  Button:
    group: Leaf
    summary: "Something to press. Carries the `action` that runs when it is pressed."
  Input:
    group: Leaf
    summary: "A text field. Its `bind.value` is the one two-way binding in the set: it reads and writes the same key."
  Select:
    group: Leaf
    summary: "A choice from a fixed list of options."
  Markdown:
    group: Leaf
    summary: "Renders markdown, for text an Agent wrote rather than text you laid out."
  Skeleton:
    group: Leaf
    summary: "A loading placeholder in the shape of the thing that has not arrived."
  Icon:
    group: Leaf
    summary: "One glyph from the icon set. A literal name, or a bound field."
  Orb:
    group: Leaf
    summary: "The voice indicator. Shows that a call is live and who is speaking."
  Ref:
    group: Helper
    summary: "Composes an atom. `props` remaps fields onto it, `with` passes literals into it."

styleKeys:
  # Size
  width:      { group: Size, summary: "Width, as a space-scale step or a page-width name." }
  height:     { group: Size, summary: "Height, as a space-scale step." }
  maxWidth:   { group: Size, summary: "An upper bound. Page-level caps use a name, an element's own size uses a step." }
  minWidth:   { group: Size, summary: "A lower bound on width." }
  minHeight:  { group: Size, summary: "A lower bound on height." }
  maxHeight:  { group: Size, summary: "An upper bound on height." }
  flex:       { group: Size, summary: "How this child shares the space its parent has left." }
  # Spacing
  padding:    { group: Spacing, summary: "Space inside the element, as a scale step." }
  margin:     { group: Spacing, summary: "Space outside the element." }
  gap:        { group: Spacing, summary: "Space between children." }
  # Layout
  direction:  { group: Layout, summary: "Whether children run in a row or a column." }
  wrap:       { group: Layout, summary: "Whether children wrap onto another line." }
  align:      { group: Layout, summary: "Alignment across the direction children run in." }
  justify:    { group: Layout, summary: "Alignment along the direction children run in." }
  display:    { group: Layout, summary: "Whether the element takes part in layout at all." }
  overflow:   { group: Layout, summary: "What happens to content larger than the box." }
  position:   { group: Layout, summary: "How the element is placed against its parent." }
  inset:      { group: Layout, summary: "All four offsets at once. `0` is the usual overlay." }
  top:        { group: Layout, summary: "Offset from the top, when positioned." }
  right:      { group: Layout, summary: "Offset from the right, when positioned." }
  bottom:     { group: Layout, summary: "Offset from the bottom, when positioned." }
  left:       { group: Layout, summary: "Offset from the left, when positioned." }
  zIndex:     { group: Layout, summary: "Which of two overlapping elements draws on top." }
  # Grid
  columns:    { group: Grid, summary: "Turns the element into a grid of this many columns." }
  span:       { group: Grid, summary: "How many of the parent grid's columns this child covers." }
  stackBelow: { group: Grid, summary: "The width at which a grid gives up and stacks. Measures the grid, never the viewport." }
  # Container queries
  container:  { group: Container, summary: "Makes this element the thing its children measure themselves against." }
  hideBelow:  { group: Container, summary: "Hide once the container is narrower than this." }
  hideAbove:  { group: Container, summary: "Hide once the container is wider than this." }
  # Surface
  background: { group: Surface, summary: "Background colour, as a semantic token name." }
  radial:     { group: Surface, summary: "A radial gradient background." }
  border:     { group: Surface, summary: "All four borders, as a token name." }
  borderTop:    { group: Surface, summary: "The top border alone." }
  borderRight:  { group: Surface, summary: "The right border alone." }
  borderBottom: { group: Surface, summary: "The bottom border alone." }
  borderLeft:   { group: Surface, summary: "The left border alone." }
  outline:    { group: Surface, summary: "A ring drawn outside the border, usually for focus." }
  shadow:     { group: Surface, summary: "Drop shadow, as a token name." }
  radius:     { group: Surface, summary: "Corner rounding on all four corners." }
  radiusTopLeft:     { group: Surface, summary: "One corner's rounding." }
  radiusTopRight:    { group: Surface, summary: "One corner's rounding." }
  radiusBottomLeft:  { group: Surface, summary: "One corner's rounding." }
  radiusBottomRight: { group: Surface, summary: "One corner's rounding." }
  # Type
  font:       { group: Type, summary: "A text style from `semantic/text-styles.yaml`, such as `headline.lg`." }
  weight:     { group: Type, summary: "Font weight, as a token name." }
  lineHeight: { group: Type, summary: "Line height, as a token name." }
  color:      { group: Type, summary: "Text colour, as a semantic token name." }
  textAlign:  { group: Type, summary: "Text alignment within its box." }
  # Media and motion
  fit:        { group: Media, summary: "How an image fills its box." }
  transform:  { group: Motion, summary: "A visual transform, such as a scale or a nudge." }
  transition: { group: Motion, summary: "Which property changes are animated, and how fast." }
  animation:  { group: Motion, summary: "A named keyframe animation from `semantic/keyframes.yaml`." }
  animationDelay: { group: Motion, summary: "How long to wait before the animation starts." }
  cursor:     { group: Motion, summary: "The pointer shown on hover." }
  # Conditional
  hover:      { group: Conditional, summary: "A patch of styles applied while the pointer is over the element." }
  active:     { group: Conditional, summary: "A patch applied while the element is being pressed." }
  disabled:   { group: Conditional, summary: "A patch applied while the element is disabled." }
  when:       { group: Conditional, summary: "A list of conditions, each applying its own style patch when it matches." }
